
[project]
name = "puns-llm"
version = "0.1.0"
description = "Linguistic inference in Portuguese puns using large language models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puns_llm"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[project.scripts]
puns-llm = "puns_llm.cli:main"
